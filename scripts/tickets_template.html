<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F3F0; --panel:#FFFFFF; --panel-2:#F7F8F6; --ink:#1A1F25; --muted:#5E6771; --line:#D9DDD8; --line-2:#E8EBE6;
  --accent:#E8791D; --accent-ink:#FFFFFF; --accent-soft:#FBE9DA; --ok:#2E9E5B; --ok-soft:#E3F3E9; --warn:#C48F12; --warn-soft:#FBF1D6; --bad:#D24B3F; --bad-soft:#F9E2DF; --focus:#2F6FE8; --focus-soft:#E4EDFC;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14171B; --panel:#1C2127; --panel-2:#222831; --ink:#E4E7EA; --muted:#9AA3AD; --line:#2C333B; --line-2:#262D35;
  --accent-ink:#1A1F25; --accent-soft:#3A2A1C; --ok-soft:#1B2E22; --warn-soft:#2F2A17; --bad-soft:#3A1F1C; --focus-soft:#1E2A3D;
}}
:root[data-theme="dark"]{
  --bg:#14171B; --panel:#1C2127; --panel-2:#222831; --ink:#E4E7EA; --muted:#9AA3AD; --line:#2C333B; --line-2:#262D35;
  --accent-ink:#1A1F25; --accent-soft:#3A2A1C; --ok-soft:#1B2E22; --warn-soft:#2F2A17; --bad-soft:#3A1F1C; --focus-soft:#1E2A3D;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.5;min-height:100vh}
a{color:var(--focus)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
header.top{position:sticky;top:0;z-index:6;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px 9px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header.top h1{font-family:var(--serif);font-size:17px;font-weight:600;margin:0}
header.top .git,header.top .store{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
header.top .spacer{flex:1}
.tally{display:flex;gap:14px;font-size:11.5px;color:var(--muted);align-items:baseline}
.tally b{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:middle}
.dot.db{background:var(--ok)} .dot.local{background:var(--warn)}
.btn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px 10px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--muted)} .btn[disabled]{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:2px 8px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--ink);border-color:var(--line)}
input[type=text],input[type=email],select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 9px;width:100%}
textarea{resize:vertical;line-height:1.55}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
.chip.new,.chip.changes{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.chip.quoted,.chip.designing{color:var(--focus);border-color:var(--focus);background:var(--focus-soft)}
.chip.approved,.chip.printing,.chip.done{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.chip.declined{color:var(--muted)}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-size:12px}
.empty{color:var(--muted);font-size:12.5px;padding:6px 2px}

/* request page */
.paper{max-width:760px;margin:0 auto;padding:28px 22px 80px;display:grid;gap:22px}
.paper h3{font-family:var(--serif);font-size:26px;margin:0;font-weight:600;text-wrap:balance;line-height:1.2}
.paper p.lede{margin:0;color:var(--muted);font-size:15px;max-width:60ch}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:s}
.step{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:0 0 6px 6px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.step b{display:block;color:var(--ink);font-size:13px;margin-bottom:3px}
.step b::before{counter-increment:s;content:counter(s) ". ";color:var(--accent);font-family:var(--mono)}
.facts{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.form{display:grid;gap:15px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px 22px}
.field{display:grid;gap:4px}
.field .lh{display:flex;gap:8px;align-items:baseline}
.field .lh b{font-size:13px;font-weight:600}
.field .lh .req{font-family:var(--mono);font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.field .hint{font-size:12px;color:var(--muted);max-width:72ch}
.field.blank textarea,.field.blank input{background:var(--panel-2)}
.foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line-2);padding-top:14px}
.foot .spacer{flex:1}
.warnline{font-size:12px;color:var(--bad)}
.okline{font-size:12px;color:var(--ok)}
.copybox{display:grid;gap:6px}
.copybox pre{margin:0;font-family:var(--mono);font-size:12px;white-space:pre-wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;max-height:280px;overflow:auto}

/* board */
.board{padding:16px 18px 60px;display:grid;gap:14px;max-width:1700px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;align-items:start}
.col{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:8px;display:grid;gap:7px;min-height:80px}
.col>h2{display:flex;gap:6px;align-items:baseline;padding:2px 3px}
.col>h2 b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.col .nxt{font-size:11px;color:var(--muted);padding:0 3px 4px;line-height:1.35}
.card{text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:0 5px 5px 0;padding:7px 9px;cursor:pointer;font:inherit;color:inherit;display:grid;gap:3px}
.card:hover{border-color:var(--muted);border-left-color:var(--accent)}
.card[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent);border-left-color:var(--accent)}
.card .id{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.card .t{font-weight:600;line-height:1.3}
.card .m{font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.card .miss{font-size:11px;color:var(--bad)}
.card[data-status="new"],.card[data-status="changes"]{border-left-color:var(--accent)}
.card[data-status="quoted"],.card[data-status="designing"]{border-left-color:var(--focus)}
.card[data-status="approved"],.card[data-status="printing"],.card[data-status="done"]{border-left-color:var(--ok)}
.card[data-status="declined"]{opacity:.55}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.7fr);gap:14px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:1fr}}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:grid;gap:14px;position:sticky;top:56px;max-height:calc(100vh - 70px);overflow:auto}
.sheet .head{display:grid;gap:4px}
.sheet .head .ttl{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25}
.sheet .head .who{font-size:12.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:12.5px}
.kv .k{color:var(--muted);white-space:nowrap}
.kv .v{white-space:pre-wrap}
.quote{border:1px solid var(--line);border-left:3px solid var(--focus);border-radius:0 5px 5px 0;padding:7px 10px;font-size:12.5px;display:grid;gap:2px}
.quote .n{font-family:var(--mono);font-size:12px}
.msg{border-radius:5px;padding:6px 9px;font-size:12.5px;display:grid;gap:3px;border:1px solid var(--line)}
.msg[data-from="me"]{background:var(--focus-soft);border-color:transparent}
.msg[data-from="requester"]{background:var(--panel-2)}
.msg .m{display:flex;gap:6px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.msg .txt{white-space:pre-wrap;max-height:160px;overflow:auto}
.hist{font-family:var(--mono);font-size:11px;color:var(--muted);display:grid;gap:1px}
.nextline{background:var(--accent-soft);border:1px solid var(--accent);border-radius:5px;padding:7px 10px;font-size:12.5px}
.intake{display:grid;gap:12px}
.filedline{background:var(--panel);border:1px solid var(--ok);border-left:3px solid var(--ok);border-radius:0 5px 5px 0;padding:8px 11px;font-size:12.5px}
.inboxlist{display:grid;gap:6px}
</style>

<header class="top">
  <h1 id="title">__TITLE__</h1>
  <span class="git" id="git"></span>
  <span class="spacer"></span>
  <div class="tally" id="tally"></div>
  <span class="store" id="store" hidden><span class="dot"></span><span id="storeMsg"></span></span>
</header>
<main id="main"></main>

<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now = () => new Date().toISOString();
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const LS = {draft: 'requests:draft', inbox: 'tickets:inbox'};
const money = (x, c) => ({USD:'$',EUR:'€',GBP:'£'}[c] || (c + ' ')) + Number(x).toFixed(2);

/* ---------- the form (shared by both pages) ---------- */
function formHtml(values, opts){
  let h = '';
  for (const f of D.fields) {
    const v = values[f.key] || '';
    const ctl = f.rows > 1
      ? '<textarea rows="' + f.rows + '" data-key="' + f.key + '" placeholder="' + esc(f.placeholder) + '">' + esc(v) + '</textarea>'
      : '<input type="' + (f.key === 'email' ? 'email' : 'text') + '" data-key="' + f.key + '" value="' + esc(v) + '" placeholder="' + esc(f.placeholder) + '">';
    h += '<div class="field' + (v.trim() ? '' : ' blank') + '"><div class="lh"><b>' + esc(f.ask) + '</b>' + (f.required ? '<span class="req">needed</span>' : '') + '</div>' +
      (f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '') + ctl + '</div>';
  }
  return h;
}
function readForm(root){
  const v = {};
  root.querySelectorAll('[data-key]').forEach(el => { v[el.dataset.key] = el.value.trim(); });
  return v;
}
function missing(v){ return D.fields.filter(f => f.required && !(v[f.key] || '').trim()).map(f => f.ask); }
function requestText(v){
  return D.fields.filter(f => (v[f.key] || '').trim()).map(f => f.ask + ':' + ((v[f.key].indexOf('\n') >= 0) ? '\n' : ' ') + v[f.key].trim()).join('\n');
}

/* ================= REQUEST PAGE (public) ================= */
function renderRequest(){
  if (D.jira && D.jira.project) {
    const url = D.jira.portal_url || '';
    $('main').innerHTML = '<div class="paper">' +
      '<h3>Ask for a part, and get a design back to look at before anything is printed.</h3>' +
      '<p class="lede">Requests are taken on the service desk portal. Raise one there: you get a 3D model you can turn in your browser, every measurement, and a price and time estimate on the request; reply to confirm or to ask for changes, and it is printed when you are happy.</p>' +
      '<div class="steps">' +
        '<div class="step"><b>You ask</b>Raise a request on the portal' + (url ? ': <a href="' + esc(url) + '">' + esc(url) + '</a>' : '') + '.</div>' +
        '<div class="step"><b>You get a design</b>A 3D viewer, the measurements, a cost and a time, on the request and by e-mail.</div>' +
        '<div class="step"><b>You confirm, or not</b>Reply CONFIRM, or say what to change. Repeat.</div>' +
        '<div class="step"><b>It is printed</b>On a ' + esc(D.printer.machine) + ', up to ' + esc(D.printer.bed) + '.</div>' +
      '</div>' +
      '<div class="facts"><span class="chip">' + esc(D.printer.machine) + '</span><span class="chip">bed ' + esc(D.printer.bed) + '</span><span class="chip">' + esc(D.printer.materials.join(', ')) + '</span></div>' +
      (url ? '<p><a class="btn primary" href="' + esc(url) + '" style="display:inline-block;text-decoration:none">Open the request portal</a></p>' : '<p class="muted">Portal address not recorded yet: run <span class="mono">tickets.py jira check</span> with JIRA_SITE set and republish.</p>') +
      '<p class="muted" style="font-size:12px">Sizes in millimetres, please. A photo of the spot with a ruler in it is worth more than any description; attach it to the request.</p>' +
    '</div>';
    return;
  }
  let draft = {}; try { draft = JSON.parse(localStorage.getItem(LS.draft) || '{}'); } catch (e) {}
  const mats = D.printer.materials.join(', ');
  $('main').innerHTML = '<div class="paper">' +
    '<h3>Ask for a part, and get a design back to look at before anything is printed.</h3>' +
    '<p class="lede">Describe what you need and where it goes. You get an e-mail with a 3D model you can turn in your browser, every measurement, and a price and time estimate. Reply to confirm or to ask for changes; it goes round until it is right, then it is printed.</p>' +
    '<div class="steps">' +
      '<div class="step"><b>You write</b>Fill this in and send the e-mail it composes.</div>' +
      '<div class="step"><b>You get a design</b>A 3D viewer, the measurements, a cost and a time.</div>' +
      '<div class="step"><b>You confirm, or not</b>Reply CONFIRM, or say what to change. Repeat.</div>' +
      '<div class="step"><b>It is printed</b>On a ' + esc(D.printer.machine) + ', up to ' + esc(D.printer.bed) + '.</div>' +
    '</div>' +
    '<div class="facts"><span class="chip">' + esc(D.printer.machine) + '</span><span class="chip">bed ' + esc(D.printer.bed) + '</span><span class="chip">' + esc(mats) + '</span><span class="chip">' + D.printer.toolheads + ' colours per print</span><span class="chip">' + esc(D.printer.layer) + ' layers</span></div>' +
    '<div class="form" id="form">' + formHtml(draft) +
      '<div class="foot"><span id="status" class="muted">Everything stays in this browser until you send it.</span><span class="spacer"></span>' +
      '<button class="btn ghost" id="clear">Clear</button>' +
      '<button class="btn" id="copy">Copy the request</button>' +
      '<button class="btn primary" id="send">Compose the e-mail</button></div>' +
      '<div class="copybox" id="copybox" hidden><div class="muted" style="font-size:12px">If the button did not open your mail app, send this text to <b>' + esc(D.inbox) + '</b> with the subject <b>' + esc(D.request_tag) + ' &lt;what you need&gt;</b>:</div><pre id="copytext"></pre></div>' +
    '</div>' +
    '<p class="muted" style="font-size:12px">Sizes in millimetres, please. A photo of the spot with a ruler in it is worth more than any description; put a link in the form or attach it to the e-mail.</p>' +
  '</div>';
  const form = $('form');
  const save = () => { try { localStorage.setItem(LS.draft, JSON.stringify(readForm(form))); } catch (e) {} };
  form.addEventListener('input', e => {
    const fld = e.target.closest('.field'); if (fld) fld.classList.toggle('blank', !e.target.value.trim());
    save();
  });
  $('clear').onclick = () => { try { localStorage.removeItem(LS.draft); } catch (e) {} renderRequest(); };
  const compose = () => {
    const v = readForm(form), miss = missing(v);
    if (miss.length) { $('status').innerHTML = '<span class="warnline">Still needed: ' + esc(miss.join(', ')) + '</span>'; return null; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) { $('status').innerHTML = '<span class="warnline">That e-mail address does not look right.</span>'; return null; }
    return v;
  };
  $('copy').onclick = () => {
    const v = compose(); if (!v) return;
    const text = requestText(v);
    $('copybox').hidden = false; $('copytext').textContent = text;
    try { navigator.clipboard.writeText(text).then(() => { $('status').innerHTML = '<span class="okline">Copied. Paste it into an e-mail to ' + esc(D.inbox) + '.</span>'; }); } catch (e) {}
  };
  $('send').onclick = () => {
    const v = compose(); if (!v) return;
    const subject = D.request_tag + ' ' + v.title;
    const body = requestText(v) + '\n\n(sent from the request page)';
    $('copybox').hidden = false; $('copytext').textContent = body;
    $('status').innerHTML = '<span class="okline">Your mail app should open with the request filled in. Attach photos there if you have them.</span>';
    window.location.href = 'mailto:' + encodeURIComponent(D.inbox) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  };
}

/* ================= BOARD (internal) ================= */
let sel = null, inbox = [], colReq = null, storeKind = 'local', view = 'ticket';
function setStore(kind, msg){ storeKind = kind; $('store').hidden = false; $('store').firstElementChild.className = 'dot ' + kind; $('storeMsg').textContent = msg; }
function lsInbox(){ try { inbox = JSON.parse(localStorage.getItem(LS.inbox) || '[]'); } catch (e) { inbox = []; } }
function lsInboxSave(){ try { localStorage.setItem(LS.inbox, JSON.stringify(inbox)); } catch (e) {} }
const isLocal = id => String(id).startsWith('l');

async function connectBoard(){
  lsInbox(); renderBoard();
  setStore('local', 'requests typed here stay in this browser');
  if (!(window.claude && window.claude.use)) return;
  try {
    const db = await window.claude.use('db');
    if (db) {
      colReq = db.collection('requests');
      colReq.orderBy('created', 'desc').onSnapshot(
        snap => { const strays = inbox.filter(r => isLocal(r.id)); inbox = snap.docs.map(d => Object.assign({id: d.id}, d.data())).concat(strays); renderBoard(); },
        err => setStore('local', 'shared inbox unavailable (' + ((err && err.code) || 'error') + ')'));
      setStore('db', 'shared · sync-notes files requests typed here');
    }
  } catch (e) { setStore('local', 'shared inbox unavailable — this browser only'); }
}
async function addRequest(fields){
  const r = {fields, created: now(), status: 'inbox', ticket: '', source: 'board page'};
  if (colReq) { try { await colReq.add(r); return true; } catch (e) { /* fall through */ } }
  r.id = uid('l'); inbox.unshift(r); lsInboxSave(); renderBoard(); return false;
}

function renderBoard(){
  const ts = D.tickets;
  $('git').textContent = D.git && D.git.hash ? D.git.hash + (D.git.dirty ? '*' : '') + ' · ' + D.generated : D.generated;
  const open = ts.filter(t => !['done', 'declined'].includes(t.status)).length;
  const waiting = ts.filter(t => t.status === 'quoted').length, act = ts.filter(t => ['new', 'changes', 'approved'].includes(t.status)).length;
  const pending = inbox.filter(r => !r.ticket && !ts.some(t => t.title === (r.fields || {}).title)).length;
  $('tally').innerHTML = '<span><b>' + open + '</b> open</span><span><b>' + act + '</b> need me</span><span><b>' + waiting + '</b> with requester</span>' + (pending ? '<span><b>' + pending + '</b> in inbox</span>' : '');
  let cols = '';
  for (const s of D.statuses) {
    const mine = ts.filter(t => t.status === s);
    if (!mine.length && ['done', 'declined'].includes(s)) continue;
    cols += '<div class="col"><h2>' + esc(s) + ' <b>' + mine.length + '</b></h2>' + (D.next[s] ? '<div class="nxt">' + esc(D.next[s]) + '</div>' : '');
    for (const t of mine) {
      const q = t.quote;
      cols += '<button class="card" data-id="' + esc(t.id) + '" data-status="' + esc(t.status) + '" aria-current="' + (sel === t.id && view === 'ticket') + '">' +
        '<span class="id">' + esc(t.id) + ' · ' + esc(t.updated) + '</span><span class="t">' + esc(t.title) + '</span>' +
        '<span class="m"><span>' + esc(t.requester.name || t.requester.email) + '</span>' + (t.jira && t.jira.status ? '<span>· ' + esc(t.jira.status) + '</span>' : '') + (t.model ? '<span>· ' + esc(t.model) + '</span>' : '') +
        (q ? '<span>· r' + q.rev + ' ' + money(q.total, q.currency) + ' ~' + q.lead_days + 'd</span>' : '') + '</span>' +
        (t.missing.length ? '<span class="miss">missing: ' + esc(t.missing.join(', ')) + '</span>' : '') + '</button>';
    }
    cols += (mine.length ? '' : '<div class="empty">—</div>') + '</div>';
  }
  const pend = inbox.filter(r => !r.ticket);
  const inboxHtml = '<div class="col"><h2>inbox <b>' + pend.length + '</b></h2><div class="nxt">typed here, not yet a ticket: the sync-notes routine files these</div>' +
    (pend.length ? pend.map(r => '<div class="card" data-status="new" style="cursor:default"><span class="id">' + esc(String(r.created || '').slice(0, 10)) + (isLocal(r.id) ? ' · this browser' : '') + '</span><span class="t">' + esc((r.fields || {}).title || 'untitled') + '</span><span class="m">' + esc((r.fields || {}).name || '') + ' ' + esc((r.fields || {}).email || '') + '</span></div>').join('') : '<div class="empty">—</div>') + '</div>';
  $('main').innerHTML = '<div class="board"><div class="split"><div style="display:grid;gap:10px">' +
    '<div style="display:flex;gap:8px;align-items:center"><button class="btn primary" id="newReq">+ Request on someone\'s behalf</button>' +
    '<span class="muted" style="font-size:12px">' + (D.jira && D.jira.project
        ? 'Jira ' + esc(D.jira.project) + (D.jira.browse_url ? ' · <a href="' + esc(D.jira.browse_url) + '">issues</a>' : '') + (D.jira.portal_url ? ' · <a href="' + esc(D.jira.portal_url) + '">portal</a>' : '') + ' — requests come from the portal; the form here is for ones taken in person'
        : 'Public form: ' + (D.pages.request_url ? '<a href="' + esc(D.pages.request_url) + '">' + esc(D.pages.request_url) + '</a>' : 'not published yet') + ' · mail to ' + esc(D.inbox || '(no mailbox)')) + '</span></div>' +
    '<div class="cols">' + cols + inboxHtml + '</div></div>' +
    '<div class="sheet" id="sheet"></div></div></div>';
  $('main').querySelectorAll('.card[data-id]').forEach(el => el.addEventListener('click', () => { sel = el.dataset.id; view = 'ticket'; renderBoard(); }));
  $('newReq').onclick = () => { view = 'intake'; renderBoard(); };
  renderSheet();
}

function renderSheet(){
  const sheet = $('sheet');
  if (view === 'intake') {
    sheet.innerHTML = '<div class="head"><div class="ttl">New request</div><div class="who">For someone who asked in person, by phone or by chat. It lands in the inbox column; the sync files it as a ticket and the quote goes to the e-mail you enter.</div></div>' +
      '<div class="intake" id="intake">' + formHtml({}) + '<div class="foot"><span id="istatus" class="muted"></span><span class="spacer"></span><button class="btn ghost" id="icancel">Cancel</button><button class="btn primary" id="isave">File it</button></div></div>';
    $('icancel').onclick = () => { view = 'ticket'; renderBoard(); };
    $('isave').onclick = async () => {
      const v = readForm($('intake')), miss = missing(v);
      if (miss.length) { $('istatus').innerHTML = '<span class="warnline">Still needed: ' + esc(miss.join(', ')) + '</span>'; return; }
      const shared = await addRequest(v);
      view = 'ticket'; renderBoard();
      $('sheet').insertAdjacentHTML('afterbegin', '<div class="filedline">Filed to the ' + (shared ? 'shared inbox — the next sync makes it a ticket.' : 'inbox of this browser only (shared store unavailable).') + '</div>');
    };
    return;
  }
  const t = D.tickets.find(x => x.id === sel);
  if (!t) {
    sheet.innerHTML = '<div class="head"><div class="ttl">Tickets</div><div class="who">Pick a card. Each column names what the ticket needs next; the repo is the record (<span class="mono">tickets/&lt;id&gt;/ticket.json</span>), this page is the view of it as of ' + esc(D.generated) + '.</div></div>' +
      '<div class="kv">' + D.statuses.map(s => '<span class="k"><span class="chip ' + s + '">' + s + '</span></span><span class="v">' + esc(D.next[s] || 'closed') + '</span>').join('') + '</div>' +
      '<div class="muted" style="font-size:12px">Rates: ' + esc(D.pricing.currency) + ' ' + Object.entries(D.pricing.materials).map(([k, v]) => k + ' ' + v.cost_per_kg + '/kg').join(', ') + '; machine ' + D.pricing.machine_per_h + '/h, labour ' + D.pricing.labor_per_h + '/h, design fee ' + D.pricing.design_fee + ', margin ' + Math.round(D.pricing.margin * 100) + '%, queue ' + D.pricing.queue_days + ' d — <span class="mono">tickets/pricing.json</span></div>';
    return;
  }
  const f = t.fields || {};
  let h = '<div class="head"><div class="ttl">' + esc(t.title) + '</div><div class="who"><span class="chip ' + esc(t.status) + '">' + esc(t.status) + '</span> &nbsp;' + esc(t.id) + ' · ' + esc(t.requester.name) + ' &lt;' + esc(t.requester.email) + '&gt; · opened ' + esc(t.created) + (t.model ? ' · <span class="mono">models/' + esc(t.model) + '</span>' : '') +
    (t.jira && t.jira.key ? ' · <a href="' + esc(t.jira.url || '#') + '">' + esc(t.jira.key) + ' in Jira</a>' + (t.jira.status ? ' (' + esc(t.jira.status) + ')' : '') : '') + '</div></div>';
  if (t.next) h += '<div class="nextline"><b>Next:</b> ' + esc(t.next) + '</div>';
  h += '<div><h2>Request</h2><div class="kv" style="margin-top:6px">' + D.fields.filter(x => f[x.key] && !['name', 'email', 'title'].includes(x.key)).map(x => '<span class="k">' + esc(x.ask) + '</span><span class="v">' + esc(f[x.key]) + '</span>').join('') + '</div>' +
    (t.missing.length ? '<div class="warnline" style="margin-top:6px">Not answered: ' + esc(t.missing.join(', ')) + ' — ask before designing.</div>' : '') + '</div>';
  if (t.quote) {
    const q = t.quote;
    h += '<div><h2>Latest quote</h2><div class="quote" style="margin-top:6px"><span class="n">r' + q.rev + ' · ' + esc(q.material) + ' ×' + q.qty + ' · ~' + q.mass_g + ' g · ~' + q.print_h + ' h · <b>' + money(q.total, q.currency) + '</b> · ~' + q.lead_days + ' d</span><span class="muted">' + (q.sent ? 'sent ' + esc(q.sent) : 'packaged, NOT sent — tickets.py send ' + esc(t.id)) + '</span></div></div>';
  }
  h += '<div><h2>Thread</h2><div style="display:grid;gap:6px;margin-top:6px">' + (t.messages || []).map(m =>
    '<div class="msg" data-from="' + esc(m.from) + '"><div class="m"><span>' + esc(String(m.when).slice(0, 16).replace('T', ' ')) + '</span><span>' + esc(m.from) + ' · ' + esc(m.kind) + (m.verdict ? ' · read as <b>' + esc(m.verdict) + '</b>' : '') + '</span></div><div class="txt">' + esc(m.text) + '</div></div>').join('') + '</div></div>';
  h += '<div><h2>History</h2><div class="hist" style="margin-top:6px">' + (t.history || []).map(x => esc(String(x.when).slice(0, 16).replace('T', ' ')) + '  ' + esc(x.from || '·') + ' → ' + esc(x.to) + '  by ' + esc(x.by) + (x.note ? '  ' + esc(x.note) : '')).join('<br>') + '</div></div>';
  sheet.innerHTML = h;
}

/* ---------- boot ---------- */
if (D.mode === 'request') { $('git').textContent = ''; $('tally').innerHTML = ''; renderRequest(); }
else connectBoard();
</script>
